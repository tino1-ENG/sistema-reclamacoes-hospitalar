name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend SPA
        working-directory: ./frontend
        env:
          GITHUB_PAGES: 'true'
          API_URL: https://sistema-reclamacoes-hospitalar-2.onrender.com/api
        run: npx quasar build

      - name: Copy 404.html and .nojekyll
        run: |
          cp frontend/dist/spa/index.html frontend/dist/spa/404.html
          touch frontend/dist/spa/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist/spa
