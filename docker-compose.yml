services:
  # 1. Base de Dados Documental — MongoDB
  mongodb:
    image: mongo:7.0
    container_name: hospitalcare_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=hospitalcare
    volumes:
      - hospitalcare_mongodb_data:/data/db
    networks:
      - hospitalcare_network

  # 2. Servidor de Aplicação — Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitalcare_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongodb:27017/hospitalcare
      - JWT_SECRET=hospitalcare_production_secret_maputo_2026_super_secure
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_SECRET=hospitalcare_refresh_secret_key_maputo_2026
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:9000,http://localhost:80,http://localhost
      - LOG_LEVEL=info
    depends_on:
      - mongodb
    networks:
      - hospitalcare_network

  # 3. Interface Web — Frontend Quasar SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: hospitalcare_frontend
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      - backend
    networks:
      - hospitalcare_network

volumes:
  hospitalcare_mongodb_data:
    driver: local

networks:
  hospitalcare_network:
    driver: bridge
